name: Cache Restore
description: >
  Restore a cache entry with actions/cache/restore@v4.

  A thin wrapper rather than a direct call, so that the cache action stays pinned in one place for
  every caller in this repo. This repo builds only on GitHub-hosted runners, so there is nothing
  to dispatch on.

inputs:
  key:
    description: Cache key.
    required: true
  path:
    description: Paths to cache (newline-separated).
    required: true
  restore-keys:
    description: Ordered list of prefix-matched keys for restoring stale cache if no exact match was found.
    default: ''

outputs:
  cache-hit:
    description: "'true' if an exact cache key match was found."
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Restore cache
      id: restore
      uses: actions/cache/restore@v4
      with:
        key: ${{ inputs.key }}
        path: ${{ inputs.path }}
        restore-keys: ${{ inputs.restore-keys }}
