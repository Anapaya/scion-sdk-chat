[package]
name = "chat-dev"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "A SCION network on this machine, with the chat server in it"

[dependencies]
axum = { workspace = true }
chat-server = { workspace = true }
clap = { workspace = true }
# The simulated network. A normal dependency here and nowhere else: the server must not carry one
# into a real deployment.
pocketscion = { workspace = true }
scion-sdk-utils = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
chat-client-core = { workspace = true }
reqwest = { workspace = true, features = ["json"] }

[lints]
workspace = true
