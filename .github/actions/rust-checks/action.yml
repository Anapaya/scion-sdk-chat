name: Rust Checks
description: >
  Run Rust formatting, linting, tests, and documentation checks.
  Format, clippy, doc and shear run on Linux only; tests run on all platforms.

inputs:
  workspace:
    description: Path to the cargo workspace.
    required: true
  version:
    description: Rust version.
    default: "nightly-2026-03-12"
  sqlx-version:
    description: sqlx-cli version, which must match the sqlx dependency.
    default: "0.9.0"

runs:
  using: composite
  steps:
    - name: Install rustfmt
      if: runner.os == 'Linux'
      shell: bash
      working-directory: ${{ inputs.workspace }}
      run: rustup toolchain install ${{ inputs.version }} --component rustfmt
    - name: Check formatting
      if: runner.os == 'Linux'
      shell: bash
      working-directory: ${{ inputs.workspace }}
      run: cargo +${{ inputs.version }} fmt --all -- --check
    - name: Run clippy
      if: runner.os == 'Linux'
      shell: bash
      working-directory: ${{ inputs.workspace }}
      run: cargo clippy_ci
    - name: Run tests
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      working-directory: ${{ inputs.workspace }}
      run: cargo test_ci
    - name: Check documentation
      if: runner.os == 'Linux'
      shell: bash
      working-directory: ${{ inputs.workspace }}
      run: RUSTDOCFLAGS="-D warnings" cargo doc_ci
    - name: Unused dependencies
      if: runner.os == 'Linux'
      shell: bash
      working-directory: ${{ inputs.workspace }}
      run: cargo install --version 1.3.2 cargo-shear && cargo shear
    - name: Query metadata is current
      # chat-server's committed .sqlx cache is what lets the query macros check SQL without a
      # database. Stale metadata still compiles, so this is the only thing that catches a query
      # nobody regenerated for — the store tests only cover queries that have a test.
      if: runner.os == 'Linux'
      shell: bash
      working-directory: ${{ inputs.workspace }}/crates/chat-server
      run: |
        cargo install --version ${{ inputs.sqlx-version }} sqlx-cli --no-default-features --features sqlite
        sqlite3 "$RUNNER_TEMP/prepare.db" < src/schema.sql
        DATABASE_URL="sqlite://$RUNNER_TEMP/prepare.db" cargo sqlx prepare --check -- --all-targets
