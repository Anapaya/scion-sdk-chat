# Copyright 2026 Anapaya Systems
#
# The XcodeGen spec. `xcodegen generate` writes ChatApp.xcodeproj from it, so the project file
# itself is not checked in.
name: ChatApp
options:
  bundleIdPrefix: com.anapaya.chat
  deploymentTarget:
    iOS: "17.0"
packages:
  ChatClient:
    path: ChatClient
targets:
  ChatApp:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: ChatClient
        product: ChatClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anapaya.chat.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  ChatApp:
    build:
      targets:
        ChatApp: all
    run:
      config: Debug
