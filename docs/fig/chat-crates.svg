<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: light-dark(#ffffff, #121212);" version="1.1" width="801px" height="300px" viewBox="-0.5 -0.5 801 300">
  <!-- Copyright 2026 Anapaya Systems. Drawn by hand in the style of the draw.io figures beside it. -->
  <defs/>
  <rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: light-dark(#ffffff, #121212);"/>
  <g>
    <text x="400" y="21.6" fill="#1e1e1e" font-family="&quot;Helvetica&quot;" font-size="22px" text-anchor="middle" style="fill: light-dark(rgb(30, 30, 30), rgb(211, 211, 211));">The crates</text>

    <!-- chat-ui-ratatui -->
    <rect x="0" y="78" width="270" height="64" rx="9.6" ry="9.6" fill="#dae8fc" stroke="#1971c2" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(25, 113, 194), rgb(86, 162, 232));"/>
    <text x="135" y="106" fill="#1e1e1e" font-family="&quot;Helvetica&quot;" font-size="15px" text-anchor="middle" style="fill: light-dark(rgb(30, 30, 30), rgb(211, 211, 211));">chat-ui-ratatui</text>
    <text x="135" y="127" fill="#495057" font-family="&quot;Helvetica&quot;" font-size="12px" text-anchor="middle" style="fill: light-dark(rgb(73, 80, 87), rgb(173, 181, 189));">the terminal UI</text>

    <!-- chat-client-core -->
    <rect x="310" y="78" width="270" height="64" rx="9.6" ry="9.6" fill="#dae8fc" stroke="#1971c2" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(25, 113, 194), rgb(86, 162, 232));"/>
    <text x="445" y="106" fill="#1e1e1e" font-family="&quot;Helvetica&quot;" font-size="15px" text-anchor="middle" style="fill: light-dark(rgb(30, 30, 30), rgb(211, 211, 211));">chat-client-core</text>
    <text x="445" y="127" fill="#495057" font-family="&quot;Helvetica&quot;" font-size="12px" text-anchor="middle" style="fill: light-dark(rgb(73, 80, 87), rgb(173, 181, 189));">the transports, on scion-http3</text>

    <!-- chat-dev -->
    <rect x="0" y="198" width="270" height="64" rx="9.6" ry="9.6" fill="#f5f5f5" stroke="#666666" style="fill: light-dark(rgb(245, 245, 245), rgb(34, 34, 34)); stroke: light-dark(rgb(102, 102, 102), rgb(160, 160, 160));"/>
    <text x="135" y="226" fill="#1e1e1e" font-family="&quot;Helvetica&quot;" font-size="15px" text-anchor="middle" style="fill: light-dark(rgb(30, 30, 30), rgb(211, 211, 211));">chat-dev</text>
    <text x="135" y="247" fill="#495057" font-family="&quot;Helvetica&quot;" font-size="12px" text-anchor="middle" style="fill: light-dark(rgb(73, 80, 87), rgb(173, 181, 189));">network + server, on pocketscion</text>

    <!-- chat-server -->
    <rect x="310" y="198" width="270" height="64" rx="9.6" ry="9.6" fill="#d5e8d4" stroke="#2f9e44" style="fill: light-dark(rgb(213, 232, 212), rgb(23, 51, 30)); stroke: light-dark(rgb(47, 158, 68), rgb(57, 153, 75));"/>
    <text x="445" y="226" fill="#1e1e1e" font-family="&quot;Helvetica&quot;" font-size="15px" text-anchor="middle" style="fill: light-dark(rgb(30, 30, 30), rgb(211, 211, 211));">chat-server</text>
    <text x="445" y="247" fill="#495057" font-family="&quot;Helvetica&quot;" font-size="12px" text-anchor="middle" style="fill: light-dark(rgb(73, 80, 87), rgb(173, 181, 189));">the API, on scion-stack + scion-h3-axum</text>

    <!-- chat-core -->
    <rect x="630" y="78" width="170" height="184" rx="9.6" ry="9.6" fill="#ffe6cc" stroke="#e8590c" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(232, 89, 12), rgb(241, 118, 52));"/>
    <text x="715" y="166" fill="#1e1e1e" font-family="&quot;Helvetica&quot;" font-size="15px" text-anchor="middle" style="fill: light-dark(rgb(30, 30, 30), rgb(211, 211, 211));">chat-core</text>
    <text x="715" y="187" fill="#495057" font-family="&quot;Helvetica&quot;" font-size="12px" text-anchor="middle" style="fill: light-dark(rgb(73, 80, 87), rgb(173, 181, 189));">the API types</text>

    <!-- chat-ui-ratatui -> chat-client-core -->
    <path d="M 270 110 L 302 110" fill="none" stroke="#1e1e1e" stroke-miterlimit="10" style="stroke: light-dark(rgb(30, 30, 30), rgb(211, 211, 211));"/>
    <path d="M 308 110 L 301 113.5 L 301 106.5 Z" fill="#1e1e1e" stroke="#1e1e1e" stroke-miterlimit="10" style="fill: light-dark(rgb(30, 30, 30), rgb(211, 211, 211)); stroke: light-dark(rgb(30, 30, 30), rgb(211, 211, 211));"/>
    <!-- chat-client-core -> chat-core -->
    <path d="M 580 110 L 622 110" fill="none" stroke="#1e1e1e" stroke-miterlimit="10" style="stroke: light-dark(rgb(30, 30, 30), rgb(211, 211, 211));"/>
    <path d="M 628 110 L 621 113.5 L 621 106.5 Z" fill="#1e1e1e" stroke="#1e1e1e" stroke-miterlimit="10" style="fill: light-dark(rgb(30, 30, 30), rgb(211, 211, 211)); stroke: light-dark(rgb(30, 30, 30), rgb(211, 211, 211));"/>
    <!-- chat-dev -> chat-server -->
    <path d="M 270 230 L 302 230" fill="none" stroke="#1e1e1e" stroke-miterlimit="10" style="stroke: light-dark(rgb(30, 30, 30), rgb(211, 211, 211));"/>
    <path d="M 308 230 L 301 233.5 L 301 226.5 Z" fill="#1e1e1e" stroke="#1e1e1e" stroke-miterlimit="10" style="fill: light-dark(rgb(30, 30, 30), rgb(211, 211, 211)); stroke: light-dark(rgb(30, 30, 30), rgb(211, 211, 211));"/>
    <!-- chat-server -> chat-core -->
    <path d="M 580 230 L 622 230" fill="none" stroke="#1e1e1e" stroke-miterlimit="10" style="stroke: light-dark(rgb(30, 30, 30), rgb(211, 211, 211));"/>
    <path d="M 628 230 L 621 233.5 L 621 226.5 Z" fill="#1e1e1e" stroke="#1e1e1e" stroke-miterlimit="10" style="fill: light-dark(rgb(30, 30, 30), rgb(211, 211, 211)); stroke: light-dark(rgb(30, 30, 30), rgb(211, 211, 211));"/>

    <text x="400" y="292" fill="#495057" font-family="&quot;Helvetica&quot;" font-size="15px" text-anchor="middle" style="fill: light-dark(rgb(73, 80, 87), rgb(173, 181, 189));">An arrow is a dependency. The Android and iOS apps are separate builds, with their own README.</text>
  </g>
</svg>
