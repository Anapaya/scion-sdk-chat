name: Rust License Check
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
"on":
  push:
    branches:
      - main
  pull_request:
    paths:
      - "**"
jobs:
  license-check:
    name: rust/licenses
    defaults:
      run:
        working-directory: .
        shell: bash
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Resolves the license of every crate in the dependency tree, transitively, and fails on
      # anything outside the allowlist. The allowlist is permissive-only and deliberately
      # identical to the one the SDK monorepo enforces, so both repos hold one policy.
      - name: Check dependency licenses
        uses: anapaya/cargo-license-action@v1
        with:
          allowed-licenses: Apache-2.0, MIT, BSD-3-Clause, MPL-2.0, Unlicense, ISC, Unicode-DFS-2016, Unicode-3.0, OpenSSL, CDLA-Permissive-2.0, Zlib
          cache-key: cargo-license-action-sbom
