name: Cache Save
description: >
  Save a cache entry with actions/cache/save@v4, unless the matching restore already hit the exact
  key. Counterpart of ./.github/actions/cache-restore.

inputs:
  key:
    description: Cache key.
    required: true
  path:
    description: Paths to cache (newline-separated).
    required: true
  cache-hit:
    description: "Pass the cache-hit output from the restore step to skip saving when the exact key was already cached."
    default: 'false'

runs:
  using: composite
  steps:
    - name: Save cache
      if: inputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        key: ${{ inputs.key }}
        path: ${{ inputs.path }}
